<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F0C" />
    <title>Nikki</title>
    <script>
      // Apply the saved theme before anything paints, so there is no dark flash in light mode.
      try {
        var t = localStorage.getItem("nikki.theme") || "dark";
        var light = t === "light" || (t === "auto" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#F2F5EC" : "#0B0F0C");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/nikki/nikki-avatar.png" />
    <link rel="apple-touch-icon" href="/nikki/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nikki" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
